name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # gitleaks-action lists a PR's commits through the API; with contents: read alone it fails
  # with 'Resource not accessible by integration' and, being advisory, never scans a PR.
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # scripts/merge-pr.ps1 requires this exact job name to pass on the PR head.
    name: Verify strategies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the classifier needs the parent, and gitleaks scans the PR's commit range
          # (<first>^..<last>), which a shallow clone cannot resolve ("unknown revision").
          fetch-depth: 0
      # A change to documentation alone skips the checks to save Actions minutes,
      # but this job still runs and passes, because merge-pr.ps1 requires it.
      # Docs-only means every changed path (both sides of a rename) is docs/** or
      # a Markdown file at the repository root; Markdown anywhere else (skills,
      # strategy folders) can be read by code or copied into an image. Anything
      # this step cannot establish runs everything: only docs_only=true skips.
      - name: Classify the change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            # The checkout is GitHub's merge of the PR into its base: its first
            # parent is the base, so the diff to it is exactly the PR's change.
            if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
              base=$(git rev-parse HEAD^1)
            fi
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --quiet --depth=1 origin "$BEFORE" && base="$BEFORE"
          fi
          if [ -z "$base" ] || ! changed=$(git diff --name-only --no-renames "$base" HEAD); then
            echo "Could not list the change; running everything."
            exit 0
          fi
          if [ -z "$changed" ]; then
            echo "Empty change; running everything."
            exit 0
          fi
          echo "$changed"
          while IFS= read -r path; do
            case "$path" in
              docs/*) ;;
              */*) echo "Not docs-only: $path"; exit 0 ;;
              *.md) ;;
              *) echo "Not docs-only: $path"; exit 0 ;;
            esac
          done <<< "$changed"
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
      - name: "Docs-only change: skipping checks"
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "Only docs/ or root Markdown changed; checks skipped. The secret scan still runs." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@v7
        if: steps.scope.outputs.docs_only != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: '*/uv.lock'
      - name: Verify agent harness
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          pwsh -NoProfile -File scripts/cross-review-selftest.ps1
          uv run --no-project --with pyyaml python scripts/validate_skills.py
      # Every top-level folder with a pyproject.toml is a strategy. Each one is
      # installed from its own lockfile, then linted, type checked and tested.
      - name: Lint, type check and test each strategy
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          mkdir -p reports
          for project in */pyproject.toml; do
            dir=$(dirname "$project")
            pkg=$(echo "$dir" | tr '-' '_')
            echo "::group::$dir"
            (
              cd "$dir"
              uv sync --locked
              uv run ruff check .
              uv run ruff format --check .
              uv run mypy
              uv run pytest --cov="$pkg" --cov-report=xml:"../reports/$dir-coverage.xml" \
                --junitxml="../reports/$dir-junit.xml"
            )
            echo "::endgroup::"
          done
      - name: Check deployment files
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          for sh in */deploy/*.sh */deploy/server/*.sh; do bash -n "$sh"; done
          shellcheck --severity=error */deploy/*.sh */deploy/server/*.sh
          uvx --from cfn-lint==1.45.0 cfn-lint */deploy/aws/*.yml
      - name: Build each strategy image
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          for dockerfile in */deploy/Dockerfile; do
            dir=${dockerfile%%/*}
            docker build --quiet -f "$dockerfile" -t "$dir:ci" "$dir"
          done
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outputs.docs_only != 'true'
        with:
          name: verification-evidence
          path: reports/
      - name: Dependency advisory
        if: steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        run: for project in */pyproject.toml; do (cd "$(dirname "$project")" && uv run pip-audit); done
      # Blocking: GitHub's own secret scanning and push protection only run while the
      # repository is public, and it switches between public and private, so this is the
      # one secret check that is always on. A false positive goes in .gitleaksignore.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
