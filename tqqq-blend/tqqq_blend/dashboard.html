<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trading Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f6f5f1;
  --surface: #fcfcfb;
  --surface-2: #f1f0eb;
  --surface-3: #e8e7e0;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e8e7e0;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.08);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --long: #2a78d6;
  --short: #e34948;
  --cash: #b9b8b0;
  --up: #006300;
  --down: #b42323;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --accent-wash: rgba(42, 120, 214, 0.08);
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 8px 24px rgba(11, 11, 11, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #222220;
    --surface-3: #2c2c2a;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #45453f;
    --border: rgba(255, 255, 255, 0.08);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --long: #3987e5;
    --short: #e66767;
    --cash: #5a5a54;
    --up: #0ca30c;
    --down: #e66767;
    --accent-wash: rgba(57, 135, 229, 0.12);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222220;
  --surface-3: #2c2c2a;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --grid: #2c2c2a;
  --axis: #45453f;
  --border: rgba(255, 255, 255, 0.08);
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --long: #3987e5;
  --short: #e66767;
  --cash: #5a5a54;
  --up: #0ca30c;
  --down: #e66767;
  --accent-wash: rgba(57, 135, 229, 0.12);
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button { font: inherit; color: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }

/* header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; flex: none; }
.logo svg { display: block; }
h1 { font-size: 20px; line-height: 1.2; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); margin: 2px 0 0; font-size: 13px; }
.theme-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.theme-btn:hover { color: var(--ink); }

/* banners */
.banner { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); }
.banner svg, .alert svg { flex: none; margin-top: 2px; }

/* overview */
.overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; margin-bottom: 28px; }
.ov {
  display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s;
}
a.ov:hover { border-color: var(--axis); transform: translateY(-1px); }
.ov-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.ov-name { font-weight: 650; font-size: 15px; }
.ov-strategy { color: var(--muted); font-size: 12.5px; }
.ov-head .pill { margin-left: auto; }
.ov-value { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; }
.ov-line { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.ov-empty { color: var(--ink-2); font-size: 13.5px; }

.badge { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.up { color: var(--up); }
.down { color: var(--down); }

/* strategy + account */
.strategy-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
.account { margin-bottom: 36px; scroll-margin-top: 16px; }
.acct-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.acct-head h2 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.acct-head .last { margin-left: auto; color: var(--muted); font-size: 13px; }
.alerts { display: grid; gap: 8px; margin-bottom: 14px; }
.alert { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); font-size: 13.5px; }
.notes { color: var(--muted); font-size: 12.5px; margin: -6px 0 14px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.card h3 { font-size: 14px; margin: 0; font-weight: 650; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.card-sub { color: var(--muted); font-size: 12.5px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: 1.6fr repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
.kpis.k4 { grid-template-columns: 1.6fr repeat(3, 1fr); }
.portfolio { margin-bottom: 36px; scroll-margin-top: 16px; }
.portfolio .grid-main > section { align-self: start; }  /* the allocation table keeps its own height */
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.reasons li { display: grid; grid-template-columns: 64px 44px 1fr; gap: 8px; align-items: baseline; }
.reasons .sym { font-weight: 650; }
.reasons .w { font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }
.reasons .t { color: var(--ink-2); line-height: 1.45; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; min-width: 0; }
.kpi .label { color: var(--ink-2); font-size: 12.5px; }
.kpi .v { font-size: 22px; font-weight: 650; margin-top: 2px; letter-spacing: -0.01em; }
.kpi .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
.kpi.hero .v { font-size: 34px; line-height: 1.1; }
.kpi.hero .deltas { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; font-weight: 600; margin-top: 4px; }
.kpi.hero .deltas span.lbl { color: var(--muted); font-weight: 400; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-3); margin: 8px 0 4px; overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 3px; }

/* layout grid */
.grid-main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; margin-bottom: 12px; }
.stack { display: grid; gap: 12px; align-content: start; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* range chips + tabs */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.seg button:focus-visible, .ov:focus-visible, .theme-btn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

/* decision */
.target { font-size: 18px; font-weight: 650; margin: 4px 0 8px; }
.alloc { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.alloc span { display: block; height: 100%; }
.alloc-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.key i.line { width: 14px; height: 2px; border-radius: 1px; }
.orders { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 6px; }
.orders li { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.side { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); }
.side.buy { color: var(--up); }
.side.sell { color: var(--down); }
.orders li.order { display: grid; gap: 4px; align-items: start; }  /* the reason sits under its order line */
.order-line { display: flex; align-items: center; gap: 8px; }
.order-why { color: var(--ink-2); font-size: 13px; line-height: 1.45; }
.rule-block { padding: 10px 0; border-top: 1px solid var(--border); }
.rule-block:first-of-type { border-top: 0; padding-top: 0; }
.rule-title { font-weight: 650; font-size: 14px; margin-top: 6px; }
.rule-detail { color: var(--ink-2); font-size: 13px; line-height: 1.5; margin-top: 2px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.note-old { margin-top: 10px; }
td.why { color: var(--ink-2); font-size: 12.5px; min-width: 220px; }
.section-label { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin: 18px 0 8px; }
.signals { display: grid; grid-template-columns: auto minmax(80px, 1fr) auto; gap: 8px 12px; align-items: center; font-size: 13.5px; }
.signals .name { color: var(--ink-2); white-space: nowrap; }
.signals .val { font-variant-numeric: tabular-nums; text-align: right; min-width: 3.2em; }
.signals .name.strong, .signals .val.strong { color: var(--ink); font-weight: 650; }
.sbar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); }
.sbar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--axis); }
.sbar .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 4px 14px; }

/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .grid line { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--axis); stroke-width: 1; }
.chart .end-label { fill: var(--ink-2); font-size: 11.5px; font-weight: 600; }
.chart .ref-label { fill: var(--ink-2); font-size: 11px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
.chart-empty { color: var(--muted); font-size: 13px; padding: 28px 0; text-align: center; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
  min-width: 160px; z-index: 5; display: none;
}
.tip .d { color: var(--muted); margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.tip .row b { font-variant-numeric: tabular-nums; }
.tip .row span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip .row i { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }

/* tables */
.table-wrap { overflow-x: auto; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.when { white-space: nowrap; color: var(--ink-2); }
.status { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
@media (min-width: 641px) { td.wide { min-width: 140px; } }
.more { margin-top: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer; }
.more:hover { color: var(--ink); }
.empty { color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 16px; font-size: 14px; }
.missed { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

footer { color: var(--muted); font-size: 12.5px; margin-top: 32px; line-height: 1.6; }

@media (max-width: 1080px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .kpi.hero { grid-column: 1 / -1; }
  .grid-main { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .pair { grid-template-columns: 1fr; }
  .card { padding: 16px; }
  .kpi.hero .v { font-size: 30px; }
  .acct-head .last { margin-left: 0; width: 100%; }
  th.opt, td.opt { display: none; }
  th, td { padding: 7px 5px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M2 14l5-5 3.5 3.5L18 5" fill="none" stroke="var(--page)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1>Trading dashboard</h1>
        <p class="sub" id="generated"></p>
      </div>
    </div>
    <button class="theme-btn" id="theme" type="button">Theme: auto</button>
  </header>
  <div id="stale"></div>
  <nav class="overview" id="overview" aria-label="Accounts at a glance"></nav>
  <main id="app"></main>
  <footer>
    Equity and prices are as of each run's decision time (about 15:30 ET), not the official close.
    Benchmarks are buy-and-hold over the same run days, from the prices each run recorded.
    The page is rebuilt after the close on weekdays; nothing on it can place or change orders.
  </footer>
</div>
<script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
<script>
"use strict";
(function () {
  const DATA = JSON.parse(document.getElementById("dashboard-data").textContent);
  const SVGNS = "http://www.w3.org/2000/svg";

  // ---- theme toggle (auto -> light -> dark), remembered per browser when storage works ----
  const themeBtn = document.getElementById("theme");
  const THEMES = ["auto", "light", "dark"];
  function applyTheme(t) {
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = "Theme: " + t;
  }
  let theme = "auto";
  try { theme = localStorage.getItem("dash-theme") || "auto"; } catch (e) { /* storage blocked */ }
  if (!THEMES.includes(theme)) theme = "auto";
  applyTheme(theme);
  themeBtn.addEventListener("click", function () {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem("dash-theme", theme); } catch (e) { /* storage blocked */ }
    applyTheme(theme);
  });

  // ---- helpers: every recorded string goes in through textContent, never innerHTML ----
  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (attrs[k] == null) continue;
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c != null && c !== false) n.append(c); });
    return n;
  }
  function svg(tag, attrs) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
    return n;
  }
  const isNum = function (x) { return typeof x === "number" && isFinite(x); };
  const money = function (x, dp) {
    if (!isNum(x)) return "—";
    const d = dp == null ? 0 : dp;
    return x.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: d, minimumFractionDigits: d }).replace("-", "−");
  };
  // Sign from the rounded value, so anything that rounds to zero shows as 0, never "−0.0".
  function signed(abs, raw, plus) {
    if (+abs === 0) return abs;
    return raw < 0 ? "−" + abs : (plus && raw > 0 ? "+" + abs : abs);
  }
  const pct = function (x, dp, plus) {
    if (!isNum(x)) return "—";
    const abs = (Math.abs(x) * 100).toFixed(dp == null ? 1 : dp);
    return signed(abs, x, plus) + "%";
  };
  const num = function (x, dp) { return isNum(x) ? signed(Math.abs(x).toFixed(dp == null ? 2 : dp), x, false) : "—"; };
  const dirClass = function (x) { return !isNum(x) || Math.abs(x) < 5e-5 ? "" : x > 0 ? "up" : "down"; };
  function hasOffset(ts) { return /(Z|[+-]\d\d:\d\d)$/.test(ts); }
  function fmtDate(d) {
    if (!d) return "—";
    const dt = new Date(d.length === 10 ? d + "T12:00:00" : d);
    return isNaN(dt) ? d : dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  function fmtTime(ts) {
    if (!ts) return "—";
    const dt = new Date(ts);
    if (isNaN(dt)) return ts;
    // Run timestamps are ET wall time with no offset; a timestamp with an offset is shown in ET too.
    const tz = hasOffset(ts) ? { timeZone: "America/New_York" } : {};
    return dt.toLocaleDateString("en-US", Object.assign({ weekday: "short", month: "short", day: "numeric" }, tz)) + ", " +
      dt.toLocaleTimeString("en-US", Object.assign({ hour: "numeric", minute: "2-digit" }, tz));
  }
  const shortDate = function (d) { return new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }); };

  // ---- status: icon + label, never color alone ----
  const ICONS = {
    good: "M4.5 8.3l2.3 2.3L11.5 6",
    warning: "M8 4.6v4.2M8 11.3v.2",
    critical: "M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8",
    info: "M8 7.4v4M8 4.9v.2",
  };
  const LEVEL_COLOR = { good: "var(--good)", warning: "var(--warning)", critical: "var(--critical)", info: "var(--muted)" };
  function statusIcon(level, size) {
    const s = svg("svg", { width: size || 16, height: size || 16, viewBox: "0 0 16 16", "aria-hidden": "true" });
    s.append(svg("circle", { cx: 8, cy: 8, r: 7.5, fill: LEVEL_COLOR[level] || LEVEL_COLOR.info }));
    s.append(svg("path", { d: ICONS[level] || ICONS.info, stroke: level === "warning" ? "#0b0b0b" : "#fff", "stroke-width": 1.8, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }));
    return s;
  }
  function pill(level, text) { return el("span", { class: "pill" }, [statusIcon(level), el("span", { text: text })]); }

  function runLevel(status) {
    const s = String(status || "");
    if (s.startsWith("error") || s.startsWith("halted")) return "critical";
    if (s === "executed") return "good";
    if (s.startsWith("skipped")) return "warning";
    return "info";
  }

  // ---- health of one account ----
  function assess(a) {
    const alerts = [], notes = [];
    if (a.kill_switch) alerts.push(["critical", "Kill switch is on (state/STOP exists): runs stop before trading."]);
    if (a.halted) alerts.push(["critical", "Halted: " + a.halted + ". Clear 'halted' in state.json to resume."]);
    const last = a.last_run;
    const lastFailed = last && String(last.status || "").startsWith("error");
    if (lastFailed) alerts.push(["critical", "Last run failed: " + last.status]);
    if (last && a.due_through && a.due_through !== "None" && String(last.ts).slice(0, 10) < a.due_through)
      alerts.push(["warning", "No run recorded for " + fmtDate(a.due_through) + " (last run " + fmtTime(last.ts) + ")."]);
    // the latest due day already has its own alert above
    const missed = (a.missed_days || []).filter(function (d) { return d !== a.due_through; });
    if (missed.length) alerts.push(["warning", missed.length + " earlier trading day(s) with no run, most recently " + fmtDate(missed[missed.length - 1]) + "."]);
    if (a.unreadable_run_lines) alerts.push(["warning", a.unreadable_run_lines + " line(s) in runs.jsonl could not be read and are left out."]);
    // The post-close reconcile credits the day's fills to this bucket's ledger; the next run refuses to
    // trade on orders it could not match, so a failed or unfinished one needs a look the same evening.
    const rc = a.reconcile, rcs = rc ? String(rc.status || "") : "";
    if (rcs.startsWith("error")) alerts.push(["critical", "Post-close reconcile failed (" + fmtTime(rc.ts) + "): " + rcs]);
    else if (/still pending|filled short/.test(rcs)) alerts.push(["warning", "Post-close reconcile (" + fmtTime(rc.ts) + "): " + rcs + "."]);
    if (a.errors_30d && !lastFailed) notes.push(a.errors_30d + " failed run(s) in the last 30 days, since recovered.");
    let level = "good", label = "Healthy";
    if (!a.runs_total) { level = "info"; label = "No runs yet"; }
    if (alerts.some(function (x) { return x[0] === "warning"; })) { level = "warning"; label = "Needs a look"; }
    if (alerts.some(function (x) { return x[0] === "critical"; })) { level = "critical"; label = a.halted || a.kill_switch ? "Halted" : "Failing"; }
    return { level: level, label: label, alerts: alerts, notes: notes };
  }

  const MODE = { "paper": "Simulated money", "live": "Real money · orders on", "live-disabled": "Real money · dry run" };

  // ---- the page is stale if a weekday close has passed since it was built ----
  function etParts(d) {
    const f = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false, weekday: "short" });
    const p = {}; f.formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
    return { date: p.year + "-" + p.month + "-" + p.day, hm: (+p.hour % 24) * 60 + +p.minute, wd: p.weekday };
  }
  function lastPublishDue(now) {
    // Walk back from now (ET) to the latest weekday whose 16:45 has passed: the page should be at least that new.
    const t = new Date(now.getTime());
    for (let i = 0; i < 8; i++) {
      const p = etParts(t);
      const weekday = p.wd !== "Sat" && p.wd !== "Sun";
      if (weekday && (i > 0 || p.hm >= 16 * 60 + 45)) return p.date;
      t.setTime(t.getTime() - 24 * 3600 * 1000);
    }
    return null;
  }
  function staleBanner() {
    const gen = String(DATA.generated || "").slice(0, 10);
    const due = lastPublishDue(new Date());
    if (!gen || !due || gen >= due) return null;
    return el("div", { class: "banner", role: "alert" }, [statusIcon("warning"), el("span", {
      text: "This page was last rebuilt on " + fmtDate(gen) + ", before the " + fmtDate(due) +
        " close. The daily publish may have failed: check the trading-dashboard timer on the server.",
    })]);
  }

  // ---- charts: inline SVG at their real width, one y-axis, crosshair + one tooltip listing every series ----
  function niceTicks(lo, hi, count) {
    if (lo === hi) { lo -= 1; hi += 1; }
    const raw = (hi - lo) / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; }).find(function (s) { return s >= raw; });
    const start = Math.floor(lo / step) * step, ticks = [];
    for (let v = start; v <= hi + step * 0.5; v += step) ticks.push(+v.toFixed(10));
    return ticks;
  }

  const CHARTS = [];
  function chart(opts) {
    const wrap = el("div", { class: "chart" });
    wrap._opts = opts;
    CHARTS.push(wrap);
    return wrap;
  }

  function draw(wrap) {
    // opts: dates[], series[{name, short, color, values[], area?}], yFmt, tipFmt, refLine?{y,label}, bars?
    const opts = wrap._opts;
    wrap.replaceChildren();
    opts.series.forEach(function (ser) { ser._last = null; });
    const n = opts.dates.length;
    const W = Math.max(260, Math.round(wrap.clientWidth || 600));
    wrap._w = W;
    const H = opts.height || 220, M = { t: 12, r: opts.endLabels ? 96 : 12, b: 26, l: 50 };
    const iw = W - M.l - M.r, ih = H - M.t - M.b;
    const all = [];
    opts.series.forEach(function (s) { s.values.forEach(function (v) { if (isNum(v)) all.push(v); }); });
    if (opts.refLine) all.push(opts.refLine.y);
    if (opts.zero) all.push(0);
    if (n < 2 || all.length < 2) {
      wrap.append(el("div", { class: "chart-empty", text: "The chart appears after two days of runs." }));
      return;
    }
    let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    const pad = (hi - lo || Math.abs(hi) || 1) * 0.08;
    if (!opts.zero || lo < 0) lo -= pad;
    if (!opts.zero || hi > 0) hi += pad;
    if (opts.clampMax != null) hi = Math.min(hi, opts.clampMax);
    if (opts.minSpan && hi - lo < opts.minSpan) {  // e.g. no drawdown yet: show 0 to -5%, not 0 to -100%
      if (opts.clampMax != null) lo = hi - opts.minSpan;
      else { const mid = (hi + lo) / 2; lo = mid - opts.minSpan / 2; hi = mid + opts.minSpan / 2; }
    }
    // the axis runs from one round tick to the next, so the top and bottom of the plot are labelled
    let ticks = niceTicks(lo, hi, opts.height && opts.height < 200 ? 3 : 4);
    if (opts.clampMax != null) ticks = ticks.filter(function (t) { return t <= opts.clampMax + 1e-9; });
    lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
    // Bars sit in equal bands, so the first and last bar stay inside the plot; lines run edge to edge.
    const x = opts.bars
      ? function (i) { return M.l + ((i + 0.5) / n) * iw; }
      : function (i) { return M.l + (i / (n - 1)) * iw; };
    const y = function (v) { return M.t + ih - ((v - lo) / (hi - lo)) * ih; };

    const s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": opts.label });
    const grid = svg("g", { class: "grid" }), axis = svg("g", { class: "axis" });
    ticks.forEach(function (t) {
      grid.append(svg("line", { x1: M.l, x2: W - M.r, y1: y(t), y2: y(t) }));
      const tx = svg("text", { x: M.l - 8, y: y(t) + 4, "text-anchor": "end" });
      tx.textContent = opts.yFmt(t, ticks.length > 1 ? ticks[1] - ticks[0] : 1);
      axis.append(tx);
    });
    const xt = Math.min(W < 420 ? 3 : 5, n);
    const seen = {};
    for (let k = 0; k < xt; k++) {
      const i = Math.round((k / (xt - 1 || 1)) * (n - 1));
      if (seen[i]) continue;
      seen[i] = 1;
      const anchor = opts.bars ? "middle" : k === 0 ? "start" : k === xt - 1 ? "end" : "middle";
      const tx = svg("text", { x: x(i), y: H - 6, "text-anchor": anchor });
      tx.textContent = shortDate(opts.dates[i]);
      axis.append(tx);
    }
    s.append(grid, axis);
    const base = opts.zero ? 0 : (opts.baseline != null ? opts.baseline : null);
    if (base != null && base >= lo && base <= hi) s.append(svg("line", { class: "baseline", x1: M.l, x2: W - M.r, y1: y(base), y2: y(base) }));

    if (opts.bars) {
      const bw = Math.max(1, Math.min(24, (iw / n) * 0.7));
      opts.series[0].values.forEach(function (v, i) {
        if (!isNum(v) || v === 0) return;
        const y0 = y(0), y1 = y(v), h = Math.abs(y1 - y0), r = Math.min(4, h, bw / 2);
        const left = x(i) - bw / 2, top = Math.min(y0, y1);
        // rounded data end, square at the baseline
        const d = v > 0
          ? "M" + left + "," + y0 + "V" + (top + r) + "Q" + left + "," + top + " " + (left + r) + "," + top + "H" + (left + bw - r) + "Q" + (left + bw) + "," + top + " " + (left + bw) + "," + (top + r) + "V" + y0 + "Z"
          : "M" + left + "," + y0 + "V" + (top + h - r) + "Q" + left + "," + (top + h) + " " + (left + r) + "," + (top + h) + "H" + (left + bw - r) + "Q" + (left + bw) + "," + (top + h) + " " + (left + bw) + "," + (top + h - r) + "V" + y0 + "Z";
        s.append(svg("path", { d: d, fill: v > 0 ? opts.posColor : opts.negColor }));
      });
    }

    if (opts.refLine && opts.refLine.y >= lo && opts.refLine.y <= hi) {
      s.append(svg("line", { x1: M.l, x2: W - M.r, y1: y(opts.refLine.y), y2: y(opts.refLine.y), stroke: "var(--critical)", "stroke-width": 1.5 }));
      const t = svg("text", { class: "ref-label", x: W - M.r, y: y(opts.refLine.y) - 5, "text-anchor": "end" });
      t.textContent = opts.refLine.label;
      s.append(t);
    }

    if (!opts.bars) opts.series.forEach(function (ser) {
      let d = "", started = false, firstI = null, lastI = null;
      ser.values.forEach(function (v, i) {
        if (!isNum(v)) { started = false; return; }
        d += (started ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1);
        started = true; if (firstI == null) firstI = i; lastI = i;
      });
      if (!d) return;
      if (ser.area) {
        const yb = y(base != null ? base : lo);
        s.append(svg("path", { d: d + "L" + x(lastI) + "," + yb + "L" + x(firstI) + "," + yb + "Z", fill: ser.color, "fill-opacity": 0.1 }));
      }
      s.append(svg("path", { d: d, fill: "none", stroke: ser.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      s.append(svg("circle", { cx: x(lastI), cy: y(ser.values[lastI]), r: 4, fill: ser.color, stroke: "var(--surface)", "stroke-width": 2 }));
      ser._last = lastI;
    });

    // direct end labels, only when they don't collide (otherwise legend + tooltip carry identity)
    if (opts.endLabels && !opts.bars) {
      const labels = opts.series.filter(function (r) { return r._last != null; })
        .map(function (r) { return { r: r, y: y(r.values[r._last]) }; })
        .sort(function (a, b) { return a.y - b.y; });
      const clear = labels.every(function (l, i) { return i === 0 || l.y - labels[i - 1].y >= 14; });
      if (clear) labels.forEach(function (l) {
        const t = svg("text", { class: "end-label", x: x(l.r._last) + 9, y: l.y + 4 });
        t.textContent = opts.yFmt(l.r.values[l.r._last]) + " " + l.r.short;
        s.append(t);
      });
    }

    // crosshair layer: the whole plot is the hit target
    const cross = svg("line", { y1: M.t, y2: M.t + ih, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
    const dots = opts.bars ? [] : opts.series.map(function (ser) {
      const c = svg("circle", { r: 4, fill: ser.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
      s.append(c); return c;
    });
    s.append(cross);
    const hit = svg("rect", { x: M.l, y: 0, width: iw, height: H, fill: "transparent", tabindex: 0, "aria-label": opts.label + ": use the arrow keys to read values" });
    s.append(hit);
    const tip = el("div", { class: "tip", role: "status" });
    wrap.append(s, tip);
    function show(i) {
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      tip.replaceChildren(el("div", { class: "d", text: fmtDate(opts.dates[i]) }));
      opts.series.forEach(function (ser, k) {
        const v = ser.values[i];
        if (dots[k]) {
          if (isNum(v)) { dots[k].setAttribute("cx", x(i)); dots[k].setAttribute("cy", y(v)); dots[k].setAttribute("visibility", "visible"); }
          else dots[k].setAttribute("visibility", "hidden");
        }
        const key = el("i"); key.style.background = ser.color;
        tip.append(el("div", { class: "row" }, [el("span", null, [key, document.createTextNode(ser.name)]), el("b", { text: (opts.tipFmt || opts.yFmt)(v) })]));
      });
      (opts.extraTip ? opts.extraTip(i) : []).forEach(function (r) {
        tip.append(el("div", { class: "row" }, [el("span", { text: r[0] }), el("b", { text: r[1] })]));
      });
      tip.style.display = "block";
      const rect = s.getBoundingClientRect(), scale = rect.width / W;
      const px = x(i) * scale, tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(rect.width - tw, px + 12 > rect.width - tw ? px - tw - 12 : px + 12)) + "px";
      tip.style.top = (M.t * scale) + "px";
    }
    function hide() {
      cross.setAttribute("visibility", "hidden"); tip.style.display = "none";
      dots.forEach(function (d) { d.setAttribute("visibility", "hidden"); });
    }
    let cur = n - 1;
    const index = opts.bars
      ? function (px) { return Math.floor(((px - M.l) / iw) * n); }
      : function (px) { return Math.round(((px - M.l) / iw) * (n - 1)); };
    hit.addEventListener("pointermove", function (ev) {
      const rect = s.getBoundingClientRect();
      cur = Math.max(0, Math.min(n - 1, index((ev.clientX - rect.left) * (W / rect.width))));
      show(cur);
    });
    hit.addEventListener("pointerleave", hide);
    hit.addEventListener("focus", function () { show(cur); });
    hit.addEventListener("blur", hide);
    hit.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowLeft") { cur = Math.max(0, cur - 1); show(cur); ev.preventDefault(); }
      if (ev.key === "ArrowRight") { cur = Math.min(n - 1, cur + 1); show(cur); ev.preventDefault(); }
    });
  }

  // "$" axis labels with enough decimals that neighbouring ticks never read the same
  function dollarTick(v, step) {
    if (!isNum(v)) return "—";
    const dp = step >= 1 ? 0 : step >= 0.1 ? 1 : 2;
    return "$" + v.toFixed(dp);
  }

  function legend(items) {
    return el("div", { class: "chart-legend" }, items.map(function (it) {
      const k = el("i", { class: it.line ? "line" : "" }); k.style.background = it.color;
      return el("span", { class: "key" }, [k, document.createTextNode(it.name)]);
    }));
  }

  // ---- overview card (one per account) ----
  function overviewCard(strat, a, st) {
    const m = a.metrics, ser = a.series || [];
    const attrs = { class: "ov" };
    let node;
    if (a.runs_total) { attrs.href = "#" + a._id; node = el("a", attrs); } else node = el("div", attrs);
    node.append(el("div", { class: "ov-head" }, [
      el("span", { class: "ov-name", text: a.name }),
      el("span", { class: "badge", text: MODE[a.mode] || a.mode }),

    ]));
    if (!a.runs_total) {
      node.append(el("div", { class: "ov-empty", text: a.mode === "live-disabled"
        ? "No runs yet. Dry runs start once this account's login is on the server; orders stay off until enabled."
        : "No runs recorded yet." }));
      return node;
    }
    if (m) {
      const day = ser.length >= 2 && isNum(ser[ser.length - 1].equity) && isNum(ser[ser.length - 2].equity) && ser[ser.length - 2].equity
        ? ser[ser.length - 1].equity / ser[ser.length - 2].equity - 1 : null;
      node.append(el("div", { class: "ov-value", text: money(m.equity) }));
      node.append(el("div", { class: "ov-line" }, [
        el("span", null, [el("span", { text: "Last day " }), el("b", { class: dirClass(day), text: pct(day, 2, true) })]),
        el("span", null, [el("span", { text: "Since start " }), el("b", { class: dirClass(m.return), text: pct(m.return, 2, true) })]),
      ]));
    }
    const last = a.last_run;
    node.append(el("div", { class: "ov-line" }, [el("span", { text: strat + " · last run " + fmtTime(last && last.ts) + " · " + (last && last.status || "—") })]));
    return node;
  }

  // ---- KPI row ----
  function kpi(label, value, note, extra, cls) {
    return el("div", { class: "kpi" + (cls ? " " + cls : "") }, [
      el("div", { class: "label", text: label }),
      el("div", { class: "v", text: value }),
      extra || null,
      note ? el("div", { class: "note", text: note }) : null,
    ]);
  }
  function kpis(a) {
    const m = a.metrics, ser = a.series || [];
    const day = ser.length >= 2 && isNum(ser[ser.length - 1].equity) && isNum(ser[ser.length - 2].equity) && ser[ser.length - 2].equity
      ? ser[ser.length - 1].equity / ser[ser.length - 2].equity - 1 : null;
    const hero = el("div", { class: "kpi hero" }, [
      el("div", { class: "label", text: "Strategy equity" }),
      el("div", { class: "v", text: money(m.equity) }),
      el("div", { class: "deltas" }, [
        el("span", null, [el("span", { class: "lbl", text: "Last day " }), el("span", { class: dirClass(day), text: pct(day, 2, true) })]),
        el("span", null, [el("span", { class: "lbl", text: "Since " + shortDate(m.start_date) + " " }), el("span", { class: dirClass(m.return), text: pct(m.return, 2, true) })]),
      ]),
      el("div", { class: "note", text: "Started at " + money(m.start_equity) + " · allotted " + money(a.capital) }),
    ]);
    const vs = function (b) {
      if (!isNum(m.return) || !isNum(b)) return null;
      const d = (m.return - b) * 100;
      return "Strategy " + (d >= 0 ? "ahead by " : "behind by ") + Math.abs(d).toFixed(1) + " pts";
    };
    // drawdown meter: how far the current drawdown has gone toward the halt line
    const used = isNum(m.drawdown) && a.halt_drawdown ? Math.min(1, Math.abs(m.drawdown) / a.halt_drawdown) : 0;
    const meter = el("div", { class: "meter", role: "img", "aria-label": pct(used, 0) + " of the way to the drawdown halt" });
    const fill = el("span");

    meter.append(fill);
    return el("div", { class: "kpis" }, [
      hero,
      kpi(a.symbols.signal + " buy and hold", pct(m.qqq_return, 2, true), vs(m.qqq_return)),
      kpi(a.symbols.long + " buy and hold", pct(m.long_return, 2, true), vs(m.long_return)),
      kpi("Drawdown from peak", pct(m.drawdown, 1), "Worst " + pct(m.max_drawdown, 1) + " · halts at " + pct(-a.halt_drawdown, 0), meter),
      kpi("Trades", String(a.trades_sent || 0), tradesNote(a, m)),
    ]);
  }
  function tradesNote(a, m) {
    const dry = (a.trades_total || 0) - (a.trades_sent || 0);
    return m.days + " trading days · " + a.runs_total + " runs" + (dry > 0 ? " · " + dry + " dry-run order(s) not sent" : "");
  }

  // ---- decision panel ----
  function signalRow(name, v, strong, range01) {
    const bar = el("div", { class: "sbar", role: "img", "aria-label": name + " " + num(v, 2) });
    if (!range01) bar.append(el("span", { class: "mid" }));
    if (isNum(v)) {
      const f = el("span", { class: "fill" });
      if (range01) { f.style.left = "0"; f.style.width = Math.min(100, Math.max(0, v * 100)) + "%"; f.style.background = "var(--axis)"; }
      else {
        const c = Math.max(-1, Math.min(1, v));
        f.style.left = (c >= 0 ? 50 : 50 + c * 50) + "%";
        f.style.width = Math.abs(c) * 50 + "%";

  function decisionCard(a) {
    const d = a.decision, sym = a.symbols;
    const card = el("section", { class: "card decision", "aria-label": "Latest decision" });
    if (!d) {
      card.append(el("div", { class: "card-head" }, [el("h3", { text: "Latest decision" })]));
      card.append(el("div", { class: "empty", text: "No run has computed a signal yet." }));

    }
    card.append(el("div", { class: "card-head" }, [
      el("h3", { text: "Latest decision" }),
      el("span", { class: "status card-sub" }, [statusDot(d.status), el("span", { text: fmtTime(d.ts) + " · " + (d.status || "—") })]),
    ]));
    const wl = isNum(d.w_long) ? d.w_long : 0, ws = isNum(d.w_short) ? d.w_short : 0, cash = Math.max(0, 1 - wl - ws);
    const parts = [];

    });

    const lk = function (c, t) { const i = el("i"); i.style.background = c; return el("span", { class: "key" }, [i, document.createTextNode(t)]); };
    card.append(el("div", { class: "alloc-legend" }, [lk("var(--long)", sym.long + " (long)"), lk("var(--short)", sym.short + " (short)"), lk("var(--cash)", "Cash")]));

    const orders = d.orders || [];
    const failed = d.status && String(d.status).startsWith("error");
    const sizing = orderReasons(a, d);
    const reasonFor = function (symbol) {
      const r = sizing.find(function (x) { return x.symbol === symbol; });
      return r ? r.text : null;
    };
    card.append(el("div", { class: "section-label", text: "What it did" }));

    orders.forEach(function (o) {
      list.append(el("li", { class: "order" }, [
        el("div", { class: "order-line" }, [

  // Why each symbol was or wasn't traded: runner.plan_orders skips a change of weight inside the rebalance
  // band unless it moves a position to or from zero. Uses what the run recorded (positions before its
  // orders, its prices and the capital it sized with).
  function orderReasons(a, d) {
    const cap = d.capital, pos = d.positions || {}, px = d.prices || {}, band = a.rebalance_band;
    if (!isNum(cap) || cap <= 0 || !isNum(band)) return [];
    const out = [];
    [[a.symbols.long, d.w_long], [a.symbols.short, d.w_short]].forEach(function (p) {
      const sym = p[0], target = isNum(p[1]) ? p[1] : 0, shares = pos[sym] || 0, price = px[sym];
      if (!isNum(price)) return;
      const held = (shares * price) / cap;
      if (!shares && !target) return;
      const pts = Math.abs(target - held) * 100, bandPts = band * 100;
      const toFromZero = (target === 0) !== (shares === 0);
      const base = sym + ": held " + pct(held, 0) + ", target " + pct(target, 0);
      let text;
      if (pts / 100 <= band && !toFromZero) text = base + ". A " + pts.toFixed(0) + "-point change is inside the " + bandPts.toFixed(0) + "-point rebalance band, so no trade.";
      else if (toFromZero) text = base + (target === 0 ? ". The target is zero, so the position is closed." : ". Opening a new position.");
      else text = base + ". A " + pts.toFixed(0) + "-point change, beyond the " + bandPts.toFixed(0) + "-point rebalance band, so it trades.";
      out.push({ symbol: sym, text: text });
    });
    return out;
  }

  // ---- charts for one account, scoped by the range control ----

    const i = ser.findIndex(function (p) { return new Date(p.date + "T12:00:00") >= from; });

  // ---- buckets from other strategies (sleeves): holdings, monthly decision ----

    if (!orders.length) list.append(el("li", { class: "card-sub", text: String(d.status).startsWith("error") ? "No orders: the run stopped before trading." : "No orders: holdings already match the targets." }));
    card.append(list);
    card.append(el("div", { class: "section-label", text: "Why" }));
    const reasons = d.why.reasons || [];
    card.append(limited(reasons, function (rows) {
      return el("ul", { class: "reasons" }, rows.map(function (r) {
        return el("li", null, [el("span", { class: "sym", text: r.symbol }), el("span", { class: "w", text: pct(r.weight, 0) }), el("span", { class: "t", text: r.text })]);
      }));
    }));
    return card;
  }
  function holdingsSection(a, st) {
    const sec = el("section", { class: "account", id: a._id, "data-mode": a.mode, "data-kind": "holdings", "aria-label": a.name + " bucket" });
    const last = a.last_run;
    sec.append(el("div", { class: "acct-head" }, [
      el("h2", { text: a.name }), el("span", { class: "badge", text: MODE[a.mode] || a.mode }), pill(st.level, st.label),
      el("span", { class: "last", text: "Last run " + fmtTime(last && last.ts) }),
    ]));
    if (st.alerts.length) sec.append(el("div", { class: "alerts" }, st.alerts.map(function (al) {
      return el("div", { class: "alert", role: al[0] === "critical" ? "alert" : null }, [statusIcon(al[0]), el("span", { text: al[1] })]);
    })));
    if (st.notes.length) sec.append(el("div", { class: "notes", text: st.notes.join(" ") }));
    if (a.metrics) {
      sec.append(kpisHoldings(a));
      sec.append(el("div", { class: "grid-main" }, [
        growthAndDrawdown(a.series, a.symbols.benchmark, a.halt_drawdown, "Bucket"),
        el("div", { class: "stack" }, [holdingsCard(a), decisionHoldings(a)]),
      ]));
    } else {
      sec.append(el("div", { class: "empty", text: "No run has valued this bucket yet." }));
      sec.append(el("div", { class: "grid-main" }, [decisionHoldings(a), el("div")]));
    }
    sec.append(activityCard(a));
    return sec;
  }

  // ---- portfolios: several buckets read as one ----
  function portfolioSection(p, i) {
    const sec = el("section", { class: "portfolio", id: "portfolio-" + i, "aria-label": p.name });
    const m = p.metrics;
    sec.append(el("div", { class: "acct-head" }, [el("h2", { text: p.name }), el("span", { class: "badge", text: "Combined buckets" })]));
    if (p.missing && p.missing.length) sec.append(el("div", { class: "alerts" }, [el("div", { class: "alert", role: "alert" }, [
      statusIcon("warning"), el("span", { text: "Not found, so left out of the totals: " + p.missing.join(", ") })])]));
    if (!m) { sec.append(el("div", { class: "empty", text: "None of its buckets has run yet." })); return sec; }
    const ser = p.series || [];
    sec.append(el("div", { class: "kpis k4" }, [
      el("div", { class: "kpi hero" }, [
        el("div", { class: "label", text: "Portfolio value" }),
        el("div", { class: "v", text: money(m.equity) }),
        el("div", { class: "deltas" }, [
          el("span", null, [el("span", { class: "lbl", text: "Last day " }), el("span", { class: dirClass(dayChange(ser)), text: pct(dayChange(ser), 2, true) })]),
          el("span", null, [el("span", { class: "lbl", text: "Since " + shortDate(m.start_date) + " " }), el("span", { class: dirClass(m.return), text: pct(m.return, 2, true) })]),
        ]),
        el("div", { class: "note", text: "Allotted " + money(m.capital) + " across " + p.members.length + " buckets" }),
      ]),
      kpi("SPY buy and hold", pct(m.bench_return, 2, true), vsText(m.return, m.bench_return)),
      kpi("Drawdown from peak", pct(m.drawdown, 1), "Worst " + pct(m.max_drawdown, 1)),
      kpi("Buckets", String(p.members.length), "each with its own capital and ledger"),
    ]));
    const rows = p.members.map(function (r) {
      const name = r.id ? el("a", { href: "#" + r.id, text: r.name }) : r.name;
      return [name, pct(r.target, 0), money(r.value), pct(r.weight, 1), pct(r.return, 2, true)];
    });
    const alloc = el("section", { class: "card", "aria-label": "Allocation" }, [
      el("div", { class: "card-head" }, [el("h3", { text: "Allocation" }), el("span", { class: "card-sub", text: "Rebalanced only by each bucket's own rules" })]),
      table([["Bucket", "wide"], ["Target", "num"], ["Value", "num"], ["Now", "num"], ["Return", "num"]], rows)]);
    sec.append(el("div", { class: "grid-main" }, [growthAndDrawdown(ser, "SPY", null, "Portfolio"), alloc]));
    return sec;
  }

  // ---- page ----
  document.getElementById("generated").textContent = "Updated " + fmtTime(DATA.generated) + " ET · rebuilt after the close on weekdays";
  const stale = staleBanner();
  if (stale) document.getElementById("stale").append(stale);
  const app = document.getElementById("app"), overview = document.getElementById("overview");
  (DATA.portfolios || []).forEach(function (p, i) {
    const m = p.metrics, card = el("a", { class: "ov", href: "#portfolio-" + i });
    card.append(el("div", { class: "ov-head" }, [el("span", { class: "ov-name", text: p.name }), el("span", { class: "badge", text: p.members.length + " buckets" })]));
    if (m) {
      card.append(el("div", { class: "ov-value", text: money(m.equity) }));
      card.append(el("div", { class: "ov-line" }, [
        el("span", null, [el("span", { text: "Since start " }), el("b", { class: dirClass(m.return), text: pct(m.return, 2, true) })]),
        el("span", null, [el("span", { text: "SPY " }), el("b", { class: dirClass(m.bench_return), text: pct(m.bench_return, 2, true) })]),
      ]));
    } else card.append(el("div", { class: "ov-empty", text: "None of its buckets has run yet." }));
    overview.append(card);
  });
  if ((DATA.portfolios || []).length) app.append(el("h2", { class: "strategy-title", text: "Portfolios" }));
  (DATA.portfolios || []).forEach(function (p, i) { app.append(portfolioSection(p, i)); });
  DATA.strategies.forEach(function (strat, si) {
    const withRuns = [];
    strat.accounts.forEach(function (a, ai) {
      a._id = a._id || "acct-" + si + "-" + ai;
      const st = assess(a);
      if (a.missing_meta && a.runs_total) st.alerts.push(["warning", "This bucket has runs but no bucket.json, so its name and limits are unknown."]);
      overview.append(overviewCard(strat.name, a, st));
      if (a.runs_total) withRuns.push([a, st]);
    });
    if (!withRuns.length) return;
    app.append(el("h2", { class: "strategy-title", text: strat.name }));
    withRuns.forEach(function (x) { app.append(x[0].kind === "holdings" ? holdingsSection(x[0], x[1]) : accountSection(strat.name, x[0], x[1])); });
  });
  CHARTS.forEach(draw);
  let pending = false;
  window.addEventListener("resize", function () {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () {
      pending = false;
      CHARTS.forEach(function (c) { if (Math.round(c.clientWidth) !== c._w) draw(c); });
    });
  });
})();
</script>
</body>
</html>
