# IBKR live account (real money). Inherits the strategy and risk settings from config.toml.
#   python -m tqqq_blend --config config.ibkr-live.toml ibkr-check
# Orders stay disabled until live_trading_enabled = true here AND the run passes --live.
extends = "config.toml"
state_dir = "state/ibkr-live"    # its own ledger (cash and shares), equity peak, and trade log
bucket = "tqqq-blend/live"
account_group = "ibkr-live"
label = "Live"

[risk]
account_check = "at_least"       # your own TQQQ/SQQQ in this account are allowed on top of the bucket's shares
capital = 10000                  # dollars of the account this strategy may use; start at 10-25% of the target
max_order_value = 15000

[broker]
name = "ibkr"
ibkr_account_type = "live"       # refuses to trade if the login turns out to be a paper account
ibkr_host = "127.0.0.1"
ibkr_port = 7496                 # TWS live; IB Gateway live is 4001
ibkr_account = ""                # set your U-number if the login has more than one account
live_trading_enabled = false     # flip to true only after 4+ weeks of clean paper runs
